<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Rotate Touch</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    AFRAME.registerComponent("touch-rotate", {
      init: function () {
        this.isDragging = false;
        this.prevX = 0;

        window.addEventListener("touchstart", e => {
          this.isDragging = true;
          this.prevX = e.touches[0].clientX;
        });

        window.addEventListener("touchmove", e => {
          if (!this.isDragging) return;

          const x = e.touches[0].clientX;
          const deltaX = x - this.prevX;
          this.prevX = x;

          const rotation = this.el.getAttribute("rotation");
          rotation.y += deltaX * 0.3; // sensitivitas
          this.el.setAttribute("rotation", rotation);
        });

        window.addEventListener("touchend", () => {
          this.isDragging = false;
        });
      }
    });
  </script>
</head>

<body style="margin:0; overflow:hidden">

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 8"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- Light -->
  <a-entity light="type: ambient; intensity: 0.8"></a-entity>
  <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>

  <!-- MARKER -->
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- CONTAINER (stabil) -->
    <a-entity>

      <!-- OBJECT YANG DIPUTAR -->
      <a-box
        position="0 0 0.3"
        scale="0.5 0.5 0.5"
        color="red"
        touch-rotate>
      </a-box>

    </a-entity>

  </a-entity>

</a-scene>

</body>
</html>
