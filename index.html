<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    #ui-overlay {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 999;
      padding: 10px 14px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-family: Arial, sans-serif;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div id="ui-overlay">Status: Menunggu kamera…</div>

<a-scene
  inspector="enabled: false"
  stats="false"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <!-- LIGHTING (BIKIN IMAGE TERASA 3D) -->
  <a-light type="ambient" intensity="0.7"></a-light>
  <a-light type="directional" position="1 1 1" intensity="0.6"></a-light>

  <!-- ASSETS -->
  <a-assets>
    <img id="imgAR" src="./wbk.jpeg">
  </a-assets>

  <!-- CAMERA -->
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- MARKER -->
  <a-entity id="marker" mindar-image-target="targetIndex: 0">

    <!-- GROUP (BIAR SMOOTH & 3D) -->
    <a-entity
      id="imageGroup"
      position="0 0 0.12"
      smooth-follow
      floating>

      <a-image
        id="image"
        src="#imgAR">
      </a-image>

    </a-entity>
  </a-entity>

</a-scene>

<script>
/* ===============================
   COMPONENT: SMOOTH ROTATION
================================ */
AFRAME.registerComponent("smooth-follow", {
  schema: { speed: { default: 0.08 } },
  tick() {
    const obj = this.el.object3D;
    obj.rotation.x += (-obj.rotation.x) * this.data.speed;
    obj.rotation.y += (-obj.rotation.y) * this.data.speed;
  }
});

/* ===============================
   COMPONENT: FLOATING EFFECT
================================ */
AFRAME.registerComponent("floating", {
  schema: {
    amplitude: { default: 0.02 },
    speed: { default: 0.05 }
  },
  tick(time) {
    this.el.object3D.position.y =
      Math.sin(time / 1000 * this.data.speed) * this.data.amplitude;
  }
});

/* ===============================
   MAIN SCRIPT
================================ */
const sceneEl = document.querySelector("a-scene");
const ui = document.getElementById("ui-overlay");
const marker = document.getElementById("marker");
const image = document.getElementById("image");
const imageGroup = document.getElementById("imageGroup");
const imgAsset = document.getElementById("imgAR");

/* AUTO RATIO IMAGE */
function applyAutoRatio() {
  const w = imgAsset.naturalWidth;
  const h = imgAsset.naturalHeight;
  if (!w || !h) return;

  const baseHeight = 1.6;   // 🔥 BESAR IMAGE DI SINI
  const aspect = w / h;

  image.setAttribute("height", baseHeight);
  image.setAttribute("width", baseHeight * aspect);
}

if (imgAsset.complete) {
  applyAutoRatio();
} else {
  imgAsset.addEventListener("load", applyAutoRatio);
}

/* CAMERA STATUS */
sceneEl.addEventListener("loaded", () => {
  const mindarSystem = sceneEl.systems["mindar-image-system"];

  mindarSystem.addEventListener("arReady", () => {
    ui.innerText = "Kamera aktif — Scan gambar target";
  });

  mindarSystem.addEventListener("arError", () => {
    ui.innerText = "ERROR: Kamera diblokir (wajib HTTPS)";
    ui.style.background = "red";
  });
});

/* MARKER EVENTS */
marker.addEventListener("targetFound", () => {
  ui.innerText = "Target ditemukan";

  imageGroup.object3D.scale.set(0.001, 0.001, 0.001);
  imageGroup.setAttribute("animation__scale", {
    property: "scale",
    to: "1 1 1",
    dur: 600,
    easing: "easeOutElastic"
  });
});

marker.addEventListener("targetLost", () => {
  ui.innerText = "Target hilang";
  imageGroup.object3D.scale.set(0.001, 0.001, 0.001);
});
</script>

</body>
</html>
